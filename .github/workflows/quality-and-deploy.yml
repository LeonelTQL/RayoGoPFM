name: Quality Gate and E2E Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Backend Lint/Tests, Flutter Analyze/Tests & SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Configuración de Node.js para Backend
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run ESLint
        run: npm run lint
        working-directory: backend

      - name: Run Backend Tests with Coverage
        run: npm run test:coverage
        working-directory: backend

      - name: Run Backend Security Audit
        run: npm run security:audit
        working-directory: backend

      # Configuración de Flutter para App
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Linter
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test --coverage

      # SonarQube Quality Gate
      - name: Validate SonarQube Secrets
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is required"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL is required"; exit 1; }

      - name: SonarQube Quality Gate Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  api-e2e:
    name: Newman, JMeter and k6
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartdelivery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartdelivery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartdelivery
      JWT_SECRET: dev_secret_longer_than_32_characters_for_signing_tokens
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Database Migrations
        run: npm run db:migrate
        working-directory: backend

      - name: Seed Database
        run: npm run db:seed
        working-directory: backend

      - name: Start API Server
        run: |
          npm start > /tmp/smart-delivery-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:4000/health && exit 0
            sleep 1
          done
          cat /tmp/smart-delivery-api.log
          exit 1
        working-directory: backend

      - name: Postman Business Flow (Newman)
        run: |
          docker run --rm --network host -v "$PWD/postman:/etc/newman" postman/newman:alpine run "/etc/newman/SmartDelivery.postman_collection.json" --bail

      - name: Install JMeter
        run: sudo apt-get update && sudo apt-get install -y jmeter

      - name: JMeter Load Testing
        run: jmeter -n -t jmeter/delivery-business-flow.jmx -Jthreads=2 -Jrampup=1 -Jduration=8 -l /tmp/jmeter-results.jtl

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: k6 Smoke Tests
        run: k6 run k6/smoke.js

      - name: k6 Load Tests
        run: k6 run k6/load.js

      - name: k6 Stress Tests
        run: k6 run k6/stress.js
